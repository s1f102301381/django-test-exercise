{% load static %}
<!DOCTYPE html>
<html lang="ja">

  <head>
    <title>To Do Application</title>
    <meta charset="UTF-8">
    <meta name="author" content="INIAD">
    <link rel="stylesheet" href="{% static 'todo/style.css' %}">
  </head>

  <body>
    <div class="detail-card">
      <h1>{{ task.title }}</h1>
      <ul class="task-info">
        <li><strong>Posted at:</strong> {{ task.posted_at }}</li>
        {% if task.due_at %}
        <li><strong>Due at:</strong> {{ task.due_at }}</li>
        {% endif %}
        {% if task.completed %}
        <li><strong>Status:</strong> Completed</li>
        {% else %}
        <li><strong>Status:</strong> Not Completed</li>
        {% endif %}
      </ul>

      <div class="action-links">
        <a href="{% url 'index' %}" class="action-btn">Top</a>
        <a href="{% url 'update' task.id %}" class="action-btn">Edit</a>
        <a href="{% url 'delete' task.id %}" class="action-btn danger">Delete</a>
        <a href="{% url 'close' task.id %}" class="action-btn">Close</a>
      </div>
    </div>
  </body>

</html>

{% load static %}
<!DOCTYPE html>
<html lang="ja">

  <head>
    <title>タスク詳細</title>
    <meta charset="UTF-8">
    <meta name="author" content="INIAD">
    <link rel="stylesheet" href="{% static 'todo/style.css' %}">
  </head>

  <body>
    <div class="detail-card">
      <h1>{{ task.title }}</h1>
      <ul class="task-info">
        <li><strong>登録日：</strong> {{ task.posted_at }}</li>
        {% if task.due_at %}
        <li><strong>期限：</strong> {{ task.due_at }}</li>
        {% endif %}
        {% if task.completed %}
        <li><strong>状態：</strong> 完了</li>
        {% else %}
        <li><strong>状態：</strong> 未完了</li>
        {% endif %}
      </ul>

      <div class="action-links">
        <a href="{% url 'index' %}" class="action-btn">一覧へ</a>
        <a href="{% url 'update' task.id %}" class="action-btn">編集</a>
        <a href="{% url 'delete' task.id %}" class="action-btn danger">削除</a>
        <a href="{% url 'close' task.id %}" class="action-btn">完了にする</a>
      </div>
    </div>
  </body>

</html>
